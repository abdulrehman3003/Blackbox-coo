<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet" crossorigin="anonymous" />
    <meta name="description" content="BlackBox COO — AI-powered operations dashboard for solo founders and small teams." />
    <title>BlackBox COO — AI Operations Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Suppress known non-critical console errors from the platform's
      // html-to-image thumbnail capture (cross-origin stylesheet cssRules).
      (function() {
        const orig = console.error;
        console.error = function() {
          var msg = Array.prototype.join.call(arguments, ' ');
          if (
            msg.includes('html-to-image') ||
            msg.includes('Failed to read') ||
            msg.includes("Cannot access rules") ||
            msg.includes('Error loading remote stylesheet')
          ) return;
          return orig.apply(this, arguments);
        };
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
