<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/nativelyai.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet" />
    <meta name="description" content="BlackBox COO — AI-powered operations dashboard for solo founders and small teams." />
    <title>BlackBox COO — AI Operations Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Suppress known non-critical console errors from the platform's
      // html-to-image thumbnail capture (cross-origin stylesheet cssRules).
      (function() {
        function isSuppressedError(msg) {
          return (
            (typeof msg === 'string' && (
              msg.includes('html-to-image') ||
              msg.includes('Failed to read') ||
              msg.includes('Cannot access rules') ||
              msg.includes('Error loading remote stylesheet')
            )) ||
            (msg && msg.name === 'SecurityError' && (
              (msg.message || '').includes('cssRules') ||
              (msg.message || '').includes('Cannot access rules')
            ))
          );
        }

        // Suppress via console.error
        var origError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isSuppressedError(arguments[i])) return;
          }
          return origError.apply(this, arguments);
        };

        // Also suppress via window.onerror
        window.addEventListener('error', function(e) {
          if (e.message && isSuppressedError(e.message)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return;
          }
          if (e.error && isSuppressedError(e.error)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return;
          }
        }, true);

        // Suppress unhandled rejections too
        window.addEventListener('unhandledrejection', function(e) {
          if (e.reason && isSuppressedError(e.reason)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return;
          }
          if (e.reason && e.reason.message && isSuppressedError(e.reason.message)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return;
          }
        }, true);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
